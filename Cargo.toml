[package]
name = "sootmark-search"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Windows Search index (Windows.edb, Windows 11's Windows.db) for forensics: every indexed file, folder, e-mail and browsing item with its path, size, times, owner and text snippet, and the gatherer's list of items with their rebuilt paths, read with sootmark-ese and sootmark-sqlite."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/search"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "windows-search", "windows"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "search"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }
ese = { package = "sootmark-ese", version = "0.1.1" }
sqlite = { package = "sootmark-sqlite", version = "0.2.0" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# The test database is 42 MB once decompressed: an optimised inflater and
# reader keep the test run short.
[profile.dev.package.sootmark-common]
opt-level = 3
[profile.dev.package.sootmark-ese]
opt-level = 3
